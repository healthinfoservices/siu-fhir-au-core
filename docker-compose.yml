# Proof-of-concept stack: HAPI FHIR server + SIU ingestion service.
# Simulated data only - HAPI is open (no authentication) as configured here.
services:
  hapi:
    # Pin a specific tag for repeatable runs; "latest" is used here because I
    # could not check which tag is current.
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"          # FHIR base: http://localhost:8080/fhir

  siu2fhir-au:
    build: .
    depends_on:
      - hapi
    environment:
      FHIR_BASE_URL: http://hapi:8080/fhir
      DEFAULT_TZ: Australia/Brisbane          # only used when HL7 times have no offset
      IDENTIFIER_SYSTEM_BASE: http://example.org/fhir/sid
      IG_CANONICAL: http://example.org/fhir/siu2fhir-au   # must match ig/sushi-config.yaml canonical
      AU_REGISTRY: /app/config/au-registry.json
      MRN_SYSTEM_BASE: http://example.org/fhir/sid/mrn
      ORGANIZATION_ID_SYSTEM: http://example.org/fhir/sid/organization
      PATIENT_PRACTITIONER_WRITE_MODE: create-only   # or upsert: SIU data overwrites existing Patient/Practitioner
      INDIGENOUS_STATUS_FROM_PID10: "true"
      SET_META_PROFILE: "true"
      LOG_LEVEL: INFO
    ports:
      - "2575:2575"          # MLLP
      - "8090:8090"          # HTTP: POST /hl7, GET /health
